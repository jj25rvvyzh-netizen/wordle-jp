<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ことばあて</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #121213;
    color: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }

  header {
    width: 100%;
    max-width: 500px;
    border-bottom: 1px solid #3a3a3c;
    padding-bottom: 12px;
    margin-bottom: 20px;
    text-align: center;
  }

  h1 { font-size: 28px; font-weight: 700; letter-spacing: 4px; }
  .subtitle { font-size: 12px; color: #818384; margin-top: 4px; }

  #board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 5px;
    margin-bottom: 24px;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }

  .tile {
    width: 62px;
    height: 62px;
    border: 2px solid #3a3a3c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 700;
    transition: border-color 0.1s;
    animation: none;
  }

  .tile.filled { border-color: #565758; }
  .tile.active { border-color: #999; }

  .tile.reveal {
    animation: flip 0.5s ease forwards;
  }

  .tile.correct  { --bg: #538d4e; }
  .tile.present  { --bg: #b59f3b; }
  .tile.absent   { --bg: #3a3a3c; }

  @keyframes flip {
    0%   { transform: rotateX(0deg); background: transparent; }
    49%  { transform: rotateX(-90deg); background: transparent; }
    50%  { transform: rotateX(-90deg); background: var(--bg); border-color: var(--bg); }
    100% { transform: rotateX(0deg);  background: var(--bg); border-color: var(--bg); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-6px); }
    40%,80% { transform: translateX(6px); }
  }

  .shake { animation: shake 0.4s ease; }

  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-20px); }
  }

  .bounce { animation: bounce 0.4s ease; }

  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }

  .kb-row {
    display: flex;
    gap: 5px;
  }

  .key {
    height: 56px;
    min-width: 42px;
    padding: 0 8px;
    border: none;
    border-radius: 4px;
    background: #818384;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s;
    user-select: none;
  }

  .key.wide { min-width: 64px; font-size: 12px; }
  .key.correct { background: #538d4e; }
  .key.present { background: #b59f3b; }
  .key.absent  { background: #3a3a3c; }

  #message {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    color: #121213;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }

  #message.show { opacity: 1; }

  #result-panel {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
  }

  #result-panel.show { display: flex; }

  #result-panel h2 { font-size: 20px; }
  #result-panel p  { color: #818384; font-size: 14px; }

  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
  }

  .btn-green { background: #538d4e; color: #fff; }
  .btn-gray  { background: #3a3a3c; color: #fff; }

  .btn-row { display: flex; gap: 10px; }
</style>
</head>
<body>

<header>
  <h1>ことばあて</h1>
  <div class="subtitle">5文字の言葉を6回以内に当てよう</div>
</header>

<div id="board"></div>
<div id="keyboard"></div>
<div id="message"></div>
<div id="result-panel">
  <h2 id="result-title"></h2>
  <p id="result-word"></p>
  <div class="btn-row">
    <button class="btn btn-green" onclick="share()">📋 シェア</button>
    <button class="btn btn-gray" onclick="newGame()">🔄 もう一回</button>
  </div>
</div>

<script>
const WORDS = [
  "あいうえお","さくらんぼ","ひまわり","なつやすみ","とうきょう",
  "しんかんせん","かいがいりょ","ほっかいどう","まんねんひつ","でんしゃ",
  "たいようけい","うちゅうせん","かがくしゃ","にほんご","せかいいち",
  "りんご","みかん","ぶどう","すいか","いちご",
  "ねこ","いぬ","うさぎ","きりん","ぞう",
  "やまだ","かわ","そら","くも","つき",
  "はな","みず","かぜ","ゆき","あめ",
  "えき","まち","ひと","て","め",
  "あした","きょう","きのう","あさ","よる",
  "たべる","のむ","みる","いく","くる",
  "あかい","あおい","しろい","くろい","きいろ",
  "おおきい","ちいさい","はやい","おそい","たかい",
  "うれしい","たのしい","かなしい","こわい","つらい",
  "がっこう","かいしゃ","びょういん","こうえん","えいが",
  "らーめん","すし","てんぷら","そば","うどん",
];

// Filter to exactly 5 chars
const VALID = WORDS.filter(w => [...w].length === 5);

// State
let answer, guesses, current, gameOver;

const ROWS = 6, COLS = 5;

const KB_ROWS = [
  ["あ","い","う","え","お"],
  ["か","き","く","け","こ"],
  ["さ","し","す","せ","そ"],
  ["た","ち","つ","て","と"],
  ["な","に","ぬ","ね","の"],
  ["は","ひ","ふ","へ","ほ"],
  ["ま","み","む","め","も"],
  ["や","ゆ","よ"],
  ["ら","り","る","れ","ろ"],
  ["わ","を","ん","っ","ー"],
  ["⌫","決定"],
];

function init() {
  answer = VALID[Math.floor(Math.random() * VALID.length)];
  guesses = [];
  current = [];
  gameOver = false;
  buildBoard();
  buildKeyboard();
  document.getElementById('result-panel').classList.remove('show');
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.id = `row-${r}`;
    for (let c = 0; c < COLS; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = `tile-${r}-${c}`;
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
}

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  KB_ROWS.forEach(keys => {
    const row = document.createElement('div');
    row.className = 'kb-row';
    keys.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k === '⌫' || k === '決定' ? ' wide' : '');
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener('click', () => handleKey(k));
      row.appendChild(btn);
    });
    kb.appendChild(row);
  });
}

function handleKey(k) {
  if (gameOver) return;
  const row = guesses.length;
  if (k === '⌫') {
    if (current.length > 0) {
      current.pop();
      updateCurrentRow();
    }
  } else if (k === '決定') {
    submitGuess();
  } else {
    if (current.length < COLS) {
      current.push(k);
      updateCurrentRow();
    }
  }
}

function updateCurrentRow() {
  const row = guesses.length;
  for (let c = 0; c < COLS; c++) {
    const tile = document.getElementById(`tile-${row}-${c}`);
    const ch = current[c] || '';
    tile.textContent = ch;
    tile.className = 'tile' + (ch ? ' filled' : '');
    if (c === current.length) tile.classList.add('active');
  }
}

function submitGuess() {
  if (current.length < COLS) {
    shakeRow(guesses.length);
    showMessage('5文字入力してください');
    return;
  }
  const guess = current.join('');
  const row = guesses.length;
  const result = score(guess, answer);
  guesses.push(guess);
  current = [];

  revealRow(row, guess, result, () => {
    updateKeyboard(guess, result);
    if (result.every(r => r === 'correct')) {
      gameOver = true;
      setTimeout(() => bounceRow(row), 100);
      setTimeout(() => showResult(true), 1600);
    } else if (guesses.length >= ROWS) {
      gameOver = true;
      setTimeout(() => showResult(false), 1600);
    }
  });
}

function score(guess, answer) {
  const g = [...guess], a = [...answer];
  const result = Array(COLS).fill('absent');
  const aUsed = Array(COLS).fill(false);

  // Correct pass
  for (let i = 0; i < COLS; i++) {
    if (g[i] === a[i]) { result[i] = 'correct'; aUsed[i] = true; g[i] = null; }
  }
  // Present pass
  for (let i = 0; i < COLS; i++) {
    if (result[i] === 'correct') continue;
    for (let j = 0; j < COLS; j++) {
      if (!aUsed[j] && g[i] === a[j]) {
        result[i] = 'present'; aUsed[j] = true; break;
      }
    }
  }
  return result;
}

function revealRow(row, guess, result, cb) {
  const chars = [...guess];
  chars.forEach((_, c) => {
    setTimeout(() => {
      const tile = document.getElementById(`tile-${row}-${c}`);
      tile.textContent = chars[c];
      tile.className = `tile ${result[c]} reveal`;
      tile.style.animationDelay = '0s';
      if (c === COLS - 1) setTimeout(cb, 600);
    }, c * 300);
  });
}

function updateKeyboard(guess, result) {
  const chars = [...guess];
  const priority = { correct: 3, present: 2, absent: 1 };
  chars.forEach((ch, i) => {
    const btn = document.querySelector(`[data-key="${ch}"]`);
    if (!btn) return;
    const cur = priority[btn.dataset.state] || 0;
    if (priority[result[i]] > cur) {
      btn.dataset.state = result[i];
      btn.className = `key${btn.classList.contains('wide') ? ' wide' : ''} ${result[i]}`;
    }
  });
}

function shakeRow(row) {
  const r = document.getElementById(`row-${row}`);
  r.classList.remove('shake');
  void r.offsetWidth;
  r.classList.add('shake');
}

function bounceRow(row) {
  for (let c = 0; c < COLS; c++) {
    setTimeout(() => {
      const tile = document.getElementById(`tile-${row}-${c}`);
      tile.classList.add('bounce');
    }, c * 80);
  }
}

function showResult(won) {
  const panel = document.getElementById('result-panel');
  document.getElementById('result-title').textContent = won
    ? ['すごい！', '完璧！', 'やった！', 'すばらしい！'][Math.min(guesses.length - 1, 3)]
    : 'ざんねん…';
  document.getElementById('result-word').textContent = `答え: ${answer}`;
  panel.classList.add('show');
}

function showMessage(msg, duration = 1500) {
  const el = document.getElementById('message');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

function share() {
  const EMOJI = { correct: '🟩', present: '🟨', absent: '⬛' };
  const lines = guesses.map(g => {
    const r = score(g, answer);
    return r.map(x => EMOJI[x]).join('');
  });
  const text = `ことばあて ${guesses.length}/${ROWS}\n\n${lines.join('\n')}`;
  navigator.clipboard.writeText(text).then(() => showMessage('クリップボードにコピーしました！'));
}

function newGame() { init(); }

document.addEventListener('keydown', e => {
  if (e.key === 'Backspace') handleKey('⌫');
  else if (e.key === 'Enter') handleKey('決定');
});

init();
</script>
</body>
</html>
